<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Verifiko certifikatën e garancisë — Apex Frames</title>
<link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
<style>
:root{ --navy:#2c4260; --ink:#1f2b3d; --mute:#6b778a; --line:#dde3ec; --ok:#1f8a5b; --okbg:#e8f6ef; --bad:#b3261e; --badbg:#fdecea; --warn:#8a5600; --warnbg:#fff3dc; --acc:#2b7bb0 }
*{ box-sizing:border-box }
body{ margin:0; font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:#f3f6fa; min-height:100vh }
.wrap{ max-width:560px; margin:0 auto; padding:28px 16px 48px }
.logo{ text-align:center } .logo img{ height:64px }
h1{ font:700 24px/1.2 Georgia,"Times New Roman",serif; text-align:center; color:var(--navy); margin:14px 0 4px }
.sub{ text-align:center; color:var(--mute); margin:0 0 22px; font-size:15px }
form{ display:flex; gap:8px } input{ flex:1; min-width:0; font:inherit; font-size:18px; letter-spacing:.5px; padding:13px 14px; border:1px solid #b9c4d4; border-radius:10px; text-transform:uppercase; background:#fff }
input:focus{ outline:none; border-color:var(--acc); box-shadow:0 0 0 3px rgba(43,123,176,.18) }
button{ font:inherit; font-weight:600; border:0; border-radius:10px; background:var(--navy); color:#fff; padding:0 20px; cursor:pointer } button:hover{ background:#1f3249 }
.res{ margin-top:22px; border-radius:14px; overflow:hidden; background:#fff; border:1px solid var(--line); box-shadow:0 2px 14px rgba(30,50,80,.08) }
.res .hd{ padding:16px 18px; display:flex; gap:12px; align-items:center; font-weight:700; font-size:18px }
.res .hd i{ width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:#fff; font-style:normal; font-size:20px; flex:none }
.res.ok .hd{ background:var(--okbg); color:var(--ok) } .res.ok .hd i{ background:var(--ok) }
.res.bad .hd{ background:var(--badbg); color:var(--bad) } .res.bad .hd i{ background:var(--bad) }
.res.warn .hd{ background:var(--warnbg); color:var(--warn) } .res.warn .hd i{ background:var(--warn) }
dl{ margin:0; padding:6px 18px 14px } dl div{ display:flex; justify-content:space-between; gap:16px; padding:11px 0; border-bottom:1px solid var(--line) } dl div:last-child{ border:0 }
dt{ color:var(--mute); font-size:14px; flex:none } dd{ margin:0; text-align:right; font-weight:600; overflow-wrap:anywhere }
.msg{ padding:4px 18px 18px; color:var(--mute); font-size:15px }
.note{ margin-top:18px; font-size:13px; color:var(--mute); text-align:center }
.foot{ margin-top:30px; text-align:center; font-size:13px; color:var(--mute) } .foot a{ color:var(--acc) }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><img src="/assets/icon.svg" alt="Apex Frames"></div>
  <h1>Verifiko certifikatën e garancisë</h1>
  <p class="sub">Shkruaj numrin që gjendet në certifikatë, p.sh. AF-2026-875</p>
  <form id="f"><input id="nr" placeholder="AF-2026-875" autocomplete="off" autocapitalize="characters" inputmode="text" aria-label="Numri i certifikatës"><button>Verifiko</button></form>
  <div id="out" aria-live="polite"></div>
  <p class="note">Për mbrojtjen e privatësisë emri i klientit shfaqet pjesërisht. Krahaso të dhënat me certifikatën që ke në dorë.</p>
  <p class="foot">Apex Frames SHPK · <a href="https://www.apexframes.co">www.apexframes.co</a> · +355 698 881 333</p>
</div>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var out = $('#out');
  function show(cls, icon, title, body) { out.innerHTML = '<div class="res ' + cls + '"><div class="hd"><i>' + icon + '</i>' + title + '</div>' + body + '</div>'; }
  function lookup(nr) {
    nr = nr.trim().toUpperCase().replace(/\s+/g, '');
    if (!nr) return;
    history.replaceState(null, '', '/v/' + encodeURIComponent(nr));
    show('warn', '…', 'Po verifikohet…', '');
    fetch('/api/cert?nr=' + encodeURIComponent(nr), { cache: 'no-store' }).then(function (r) { return r.json().then(function (d) { return { s: r.status, d: d }; }); }).then(function (x) {
      var d = x.d;
      if (x.s === 404) return show('bad', '✕', 'Certifikata nuk u gjet', '<p class="msg">Numri <b>' + esc(nr) + '</b> nuk ekziston në regjistrin e Apex Frames. Kontrollo numrin ose na kontakto.</p>');
      if (x.s === 400) return show('bad', '✕', 'Numër i pavlefshëm', '<p class="msg">' + esc(d.error || 'Formati: AF-2026-875') + '</p>');
      if (!d.found) return show('bad', '!', 'Gabim', '<p class="msg">' + esc(d.error || 'Provo përsëri.') + '</p>');
      var rows = '<dl><div><dt>Numri</dt><dd>' + esc(d.nr) + '</dd></div><div><dt>Klienti</dt><dd>' + esc(d.name) + '</dd></div><div><dt>Produkti</dt><dd>' + esc(d.product).replace(/\n/g, '<br>') + '</dd></div><div><dt>Data e blerjes</dt><dd>' + esc(d.purchaseDate) + '</dd></div><div><dt>Garanci</dt><dd>' + esc(d.years) + ' vjet, deri më ' + esc(d.validUntil) + '</dd></div></dl>';
      var p = (d.validUntil || '').split('/'), exp = p.length === 3 && new Date(+p[2], +p[1] - 1, +p[0] + 1) < new Date();
      if (d.status === 'revoked') show('bad', '✕', 'Certifikata është anuluar', rows);
      else if (exp) show('warn', '!', 'Certifikata është e vërtetë, por garancia ka skaduar', rows);
      else show('ok', '✓', 'Certifikatë e vlefshme', rows);
    }).catch(function () { show('bad', '!', 'Nuk u lidh me serverin', '<p class="msg">Kontrollo lidhjen e internetit dhe provo përsëri.</p>'); });
  }
  $('#f').addEventListener('submit', function (e) { e.preventDefault(); lookup($('#nr').value); });
  var m = location.pathname.match(/\/v\/([^/]+)/), q = new URLSearchParams(location.search).get('nr'), nr = (m && decodeURIComponent(m[1])) || q || '';
  if (nr && nr !== ':splat') { $('#nr').value = nr.toUpperCase(); lookup(nr); } else $('#nr').focus();
})();
</script>
</body>
</html>
